name: Build

# Pushing a version tag (for example v1.2.0) builds the exe and publishes it as
# that version's release. The app's update check reads the newest release tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: apple-music-rpc
          path: target/release/apple-music-rpc.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/apple-music-rpc.exe \
            --title "Apple Music RPC ${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md). Download apple-music-rpc.exe and run it."
